openapi: 3.2.0
info:
  title: Urantia Papers Search API
  version: 1.0.0
  description: 'An API and MCP server for the Urantia Papers. Structured access to all 197 papers and more than 14,500 paragraphs, with full-text and semantic search, named entities, Bible cross-references, and audio. No key needed. Docs: https://docs.urantia.dev'
  termsOfService: https://docs.urantia.dev/terms-of-service
  contact:
    name: urantia.dev
    url: https://docs.urantia.dev/help
    email: kelson@urantia.dev
  license:
    name: MIT
    url: https://github.com/urantia-hub/urantia-dev-api/blob/main/LICENSE
servers:
- url: https://api.urantia.dev
  description: Production
- url: http://localhost:3000
  description: Local development
security: []
tags:
- name: Search
paths:
  /search:
    post:
      operationId: search
      tags:
      - Search
      summary: Full-text search across all paragraphs
      description: 'Search the Urantia Papers using full-text search. Supports three search modes:

        - **and**: All words must appear (default)

        - **or**: Any word can appear

        - **phrase**: Exact phrase match


        Results are ranked by relevance. Optional filters: paperId, partId.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  minLength: 1
                  maxLength: 500
                page:
                  type: integer
                  minimum: 0
                  default: 0
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                paperId:
                  type: string
                partId:
                  type: string
                type:
                  type: string
                  enum:
                  - phrase
                  - and
                  - or
                  default: and
                include:
                  type: string
              required:
              - q
            example:
              q: Thought Adjuster
              limit: 2
      responses:
        '200':
          description: Search results with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        standardReferenceId:
                          type: string
                        sortId:
                          type: string
                        paperId:
                          type: string
                        sectionId:
                          type:
                          - string
                          - 'null'
                        partId:
                          type: string
                        paperTitle:
                          type: string
                        sectionTitle:
                          type:
                          - string
                          - 'null'
                        paragraphId:
                          type: string
                        text:
                          type: string
                        htmlText:
                          type: string
                        language:
                          type: string
                        labels:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                        audio:
                          type:
                          - object
                          - 'null'
                          additionalProperties:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                format:
                                  type: string
                                url:
                                  type: string
                                duration:
                                  type: number
                                bitrate:
                                  type: number
                                fileSize:
                                  type: number
                              required:
                              - format
                              - url
                        entities:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              type:
                                type: string
                                enum:
                                - being
                                - place
                                - order
                                - race
                                - religion
                                - concept
                            required:
                            - id
                            - name
                            - type
                        bibleParallels:
                          type: array
                          items:
                            type: object
                            properties:
                              chunkId:
                                type: string
                              reference:
                                type: string
                              bookCode:
                                type: string
                              chapter:
                                type: integer
                              verseStart:
                                type: integer
                              verseEnd:
                                type: integer
                              text:
                                type: string
                              similarity:
                                type: number
                              rank:
                                type: integer
                              source:
                                type: string
                              embeddingModel:
                                type: string
                            required:
