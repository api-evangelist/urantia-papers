  /search/semantic:
    post:
      operationId: semanticSearch
      tags:
      - Search
      summary: Semantic similarity search across all paragraphs
      description: 'Search the Urantia Papers using semantic similarity (vector embeddings).

        Returns conceptually related results even without exact keyword matches.

        Optional filters: paperId, partId.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  minLength: 1
                  maxLength: 2000
                page:
                  type: integer
                  minimum: 0
                  default: 0
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                paperId:
                  type: string
                partId:
                  type: string
                include:
                  type: string
              required:
              - q
            example:
              q: what happens after death
              limit: 2
      responses:
        '200':
          description: Semantic search results with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        standardReferenceId:
                          type: string
                        sortId:
                          type: string
                        paperId:
                          type: string
                        sectionId:
                          type:
                          - string
                          - 'null'
                        partId:
                          type: string
                        paperTitle:
                          type: string
                        sectionTitle:
                          type:
                          - string
                          - 'null'
                        paragraphId:
                          type: string
                        text:
                          type: string
                        htmlText:
                          type: string
                        language:
                          type: string
                        labels:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                        audio:
                          type:
                          - object
                          - 'null'
                          additionalProperties:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                format:
                                  type: string
                                url:
                                  type: string
                                duration:
                                  type: number
                                bitrate:
                                  type: number
                                fileSize:
                                  type: number
                              required:
                              - format
                              - url
                        entities:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              type:
                                type: string
                                enum:
                                - being
                                - place
                                - order
                                - race
                                - religion
                                - concept
                            required:
                            - id
