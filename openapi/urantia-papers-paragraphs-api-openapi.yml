                        format: mp3
                        bitrate: 160
                        duration: 18.4
                        fileSize: 367680
                    gpt-4o-mini-tts:
                      cedar:
                        url: https://cdn.urantia.dev/audio/eng/paragraphs/cedar/gpt-4o-mini-tts-cedar-1:2.5.1.mp3
                        format: mp3
                        bitrate: 192
                        duration: 18.1
                        fileSize: 434511
                navigation:
                  prev: '2:4.5'
                  next: '2:5.2'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '400':
          description: Invalid reference format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '404':
          description: Paragraph not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '429':
          description: Too many requests
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
  /paragraphs/{ref}/context:
    get:
      operationId: getParagraphContext
      tags:
      - Paragraphs
      summary: Get a paragraph with surrounding context
      description: 'Returns the target paragraph along with N paragraphs before and after it (ordered by sort_id).

        Useful for AI agents doing RAG that need surrounding context for better understanding.

        The `window` query parameter controls how many paragraphs before/after to include (default: 2, max: 10).


        Use `?include=entities` to include typed entity mentions in the response.'
      parameters:
      - schema:
          type: string
        required: true
        name: ref
        in: path
        example: '2:5.1'
      - schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
        required: false
        name: window
        in: query
      - schema:
          type: string
        required: false
        name: include
        in: query
      - schema:
          type: string
          enum:
          - default
          - rag
          default: default
        required: false
        name: format
        in: query
      - schema:
          type: string
          enum:
          - eng
          - es
          - fr
          - pt
          - de
          - ko
          default: eng
        required: false
        name: lang
        in: query
      responses:
