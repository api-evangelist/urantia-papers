tools:
- name: toc.get
  description: Get the full table of contents of the Urantia Papers. Returns the Foreword and the 4 parts, with all 197 papers
    and their titles.
- name: papers.list
  description: List all 197 papers of the Urantia Papers with their metadata (id, title, partId, labels), as a flat list.
- name: papers.get
  description: Get a single paper with all its paragraphs. Paper IDs range from 0 (Foreword) to 196. Each paragraph has its
    reference, section, and plain text, so a whole paper fits in one call. Optionally include entity mentions.
- name: papers.sections
  description: Get all sections within a paper, ordered by section number. Useful for understanding paper structure before
    reading specific sections.
- name: paragraphs.random
  description: Get a random paragraph from the Urantia Papers. Great for daily quotes, exploration, or discovering new passages.
- name: paragraphs.get
  description: 'Look up a specific paragraph by reference. Supports three formats: globalId ("1:2.0.1"), standardReferenceId
    ("2:0.1"), or paperSectionParagraphId ("2.0.1"). The format is auto-detected.'
- name: paragraphs.context
  description: Get a paragraph with surrounding context (N paragraphs before and after within the same paper). Useful for
    understanding passages in context.
- name: search.fulltext
  description: 'Full-text search across all paragraphs of the Urantia Papers. Supports three modes: "and" (all words must
    appear, default), "or" (any word), "phrase" (exact phrase). Results ranked by relevance.'
- name: search.semantic
  description: Search the Urantia Papers using semantic similarity (vector embeddings). Returns conceptually related results
    even without exact keyword matches.
- name: entities.list
  description: 'Browse the entity catalog: beings, places, orders, races, religions, and concepts mentioned in the Urantia
    Papers. Supports filtering by type and searching by name.'
- name: entities.get
  description: Get detailed information about a specific entity by its slug ID. Returns name, type, aliases, description,
    related entities, and citation count.
- name: entities.paragraphs
  description: Get all paragraphs that mention a specific entity, ordered by position in the text. Useful for studying everything
    said about a particular being, place, or concept.
- name: audio.get
  description: Get the audio file URL for a specific paragraph. Accepts any paragraph reference format (globalId "1:2.0.1",
    standardReferenceId "2:0.1", or paperSectionParagraphId "2.0.1").
- name: bible.books
  description: 'List all 81 books of the World English Bible (eng-web): 39 Old Testament + 15 deuterocanonical + 27 New Testament.
    Each entry includes OSIS book code, full name, abbreviation, canonical order, canon, and chapter/verse counts.'
- name: bible.book
  description: Get metadata for a single Bible book including chapter and verse counts. Accepts OSIS codes ("Gen"), USFM codes
    ("GEN"), full names ("Genesis"), and aliases ("genesis", "1-maccabees") — case-insensitive, hyphens/underscores tolerated.
- name: bible.chapter
  description: Get every verse in a Bible chapter, ordered by verse number. Accepts OSIS, USFM, full name, or alias for `book_code`.
- name: bible.verse
  description: Get a single verse from the World English Bible (eng-web). Accepts OSIS, USFM, full name, or alias for `book_code`.
- name: bible.verse.urantia_parallels
  description: 'Returns the top 10 Urantia paragraphs whose embeddings are nearest to the Bible chunk that contains this verse.
    Pre-computed at seed time with text-embedding-3-large (3072-d) cosine similarity. Each result carries a similarity score
    (0..1) and rank (1..10).


    These are semantic neighbors, not a curated list of parallels.'
- name: bible.search.semantic
  description: 'Free-form natural-language search across all Bible chunks, ranked by cosine similarity. Each result includes
    the top-N pre-computed Urantia paragraphs related to that chunk. One query surfaces both Bible matches and the relevant
    Urantia content. Optional filters: `canon` (`ot`, `deuterocanon`, `nt`) and `book_code`. Set `urantia_parallel_limit`
    to 0 to leave out the Urantia paragraphs.'
